name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Show repo layout
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -name "gradlew" -o -maxdepth 3 -name "settings.gradle*" -o -maxdepth 3 -name "build.gradle*"
      - name: Build
        run: |
          GRADLEW=$(find . -maxdepth 3 -name gradlew | head -n 1)
          echo "Using: $GRADLEW"
          cd "$(dirname "$GRADLEW")"
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
